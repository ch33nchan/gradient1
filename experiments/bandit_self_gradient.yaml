# Self-Gradient Bandit Experiment Configuration
# This is the main experiment for testing gradient-based planning in bandits

experiment:
  name: "bandit_self_gradient"
  type: "bandit"
  description: "Self-aware bandit agent with gradient prediction"

environment:
  n_arms: 10
  non_stationary: false
  drift_rate: 0.1
  seed: 42

agent:
  type: "self_gradient"
  learning_rate: 0.01
  meta_learning_rate: 0.001
  gradient_clip: 1.0
  buffer_size: 2000
  batch_size: 32
  exploration_episodes: 100
  hidden_dim: 64

baselines:
  - name: "epsilon_greedy"
    epsilon: 0.1
  - name: "ucb"
    ucb_c: 2.0
  - name: "thompson"

training:
  n_episodes: 5000
  log_interval: 100
  save_interval: 500

logging:
  log_dir: "logs"
  save_metrics: true
  save_plots: true
