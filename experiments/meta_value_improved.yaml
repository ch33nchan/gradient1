# Improved Meta-Value Training (No Planning)
#
# Tests whether improved meta-value training targets lead to better V(θ) quality.
#
# Improvements over baseline:
# 1. Global normalization (running statistics) instead of batch normalization
# 2. No entropy penalty (removes mixed signals)
# 3. Planning DISABLED to isolate meta-value quality
#
# Key question: Does V(θ) correlation improve from ~0.04 to >0.3?

experiment:
  name: "meta_value_improved"
  type: "bandit"
  description: "Test improved meta-value training without planning"

environment:
  n_arms: 5
  non_stationary: false
  drift_rate: 0.1
  seed: 42

agent:
  type: "self_gradient"
  learning_rate: 0.01
  meta_learning_rate: 0.001
  gradient_clip: 1.0
  buffer_size: 1000
  batch_size: 16
  exploration_episodes: 50
  hidden_dim: 32

  # Planning DISABLED (testing meta-value quality only)
  enable_planning: false

  # Meta-value training improvements
  meta_value_use_global_norm: true     # Use running statistics instead of batch stats
  meta_value_disable_entropy: true     # Remove entropy penalty
  meta_value_use_ema_rewards: false    # Not implemented yet (buffer changes needed)
  meta_value_ema_alpha: 0.1

baselines:
  - name: "epsilon_greedy"
    epsilon: 0.1
  - name: "ucb"
    ucb_c: 2.0

training:
  n_episodes: 1000
  log_interval: 50
  save_interval: 200

logging:
  log_dir: "logs"
  save_metrics: true
  save_plots: true
