# Gated Reward-Based Planning with Small Update Bonus
# Planning optimizes for: predicted reward + small bonus for parameter change
# Tests if exploration bonus helps

experiment:
  name: "planning_gated_reward_plus_bonus"
  type: "bandit"
  description: "Gated planning with reward plus small update bonus"

environment:
  n_arms: 5
  non_stationary: false
  drift_rate: 0.1
  seed: 42

agent:
  type: "self_gradient"
  learning_rate: 0.01
  meta_learning_rate: 0.001
  gradient_clip: 1.0
  buffer_size: 1000
  batch_size: 16
  exploration_episodes: 50
  hidden_dim: 32

  # Planning control - GATED
  enable_planning: true
  planning_warmup_episodes: 150  # Wait for gradient model to learn
  planning_grad_error_threshold: 0.25  # Only plan when error is low
  planning_max_weight: 0.7  # Blend planning with greedy
  planning_ramp_episodes: 100  # Gradually increase planning influence

  # Planning objective - REWARD + SMALL BONUS
  planning_objective: "reward_plus_update_norm"  # Hybrid objective
  planning_beta_self_change: 0.01  # Small coefficient for update magnitude
  gradient_step_scale: 1.0  # Look ahead 1 step

baselines:
  - name: "epsilon_greedy"
    epsilon: 0.1
  - name: "ucb"
    ucb_c: 2.0

training:
  n_episodes: 1000
  log_interval: 50
  save_interval: 200

logging:
  log_dir: "logs"
  save_metrics: true
  save_plots: true
