# ============================================================================
# FINAL BANDIT CONFIG - DO NOT MODIFY
# ============================================================================
# This config represents the final state of bandit meta-value experiments.
# Bandit work is CLOSED with negative result (see README.md).
# Ablation study: Planning objective variants did not change outcome.
# See: analysis/planning_failure_diagnosis_report.md
# ============================================================================
#
# Ablation 1: No Planning
# Train gradient predictor but don't use it for action selection
# Agent behaves like greedy policy while learning gradient model

experiment:
  name: "ablation_no_planning"
  type: "bandit"
  description: "Self-gradient agent WITHOUT planning - verifies gradient learning without planning interference"

environment:
  n_arms: 5
  non_stationary: false
  drift_rate: 0.1
  seed: 42

agent:
  type: "self_gradient"
  learning_rate: 0.01
  meta_learning_rate: 0.001
  gradient_clip: 1.0
  buffer_size: 1000
  batch_size: 16
  exploration_episodes: 50
  hidden_dim: 32

  # Ablation parameters
  enable_planning: false  # DO NOT use gradient-based planning
  planning_exploration_bonus: 0.0
  gradient_step_scale: 1.0

baselines:
  - name: "epsilon_greedy"
    epsilon: 0.1
  - name: "ucb"
    ucb_c: 2.0

training:
  n_episodes: 1000
  log_interval: 50
  save_interval: 200

logging:
  log_dir: "logs"
  save_metrics: true
  save_plots: true
