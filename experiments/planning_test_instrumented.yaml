# Quick test run with planning instrumentation
# For testing planning trace logging

experiment:
  name: "planning_test_instrumented"
  type: "bandit"
  description: "Quick test with planning trace"

environment:
  n_arms: 5
  non_stationary: false
  drift_rate: 0.1
  seed: 42

agent:
  type: "self_gradient"
  learning_rate: 0.01
  meta_learning_rate: 0.001
  gradient_clip: 1.0
  buffer_size: 1000
  batch_size: 16
  exploration_episodes: 50
  hidden_dim: 32

  # Planning ENABLED with improved meta-value
  enable_planning: true
  planning_warmup_episodes: 100
  planning_grad_error_threshold: 0.3
  planning_max_weight: 1.0
  planning_ramp_episodes: 100
  planning_objective: "reward"
  planning_beta_self_change: 0.0
  gradient_step_scale: 1.0

  # Meta-value training improvements
  meta_value_use_global_norm: true
  meta_value_disable_entropy: true
  meta_value_use_ema_rewards: false
  meta_value_ema_alpha: 0.1

baselines:
  - name: "epsilon_greedy"
    epsilon: 0.1
  - name: "ucb"
    ucb_c: 2.0

training:
  n_episodes: 300
  log_interval: 50
  save_interval: 100

logging:
  log_dir: "logs"
  save_metrics: true
  save_plots: true
