# Meta-Value-Based Planning with Exploration Bonus
#
# Same as planning_meta_value_reward_only, but adds a small exploration bonus
# based on gradient magnitude to encourage actions that lead to larger updates.
#
# Planning objective: For each candidate action a:
#   1. Predict gradient: Δθ(a) = g(θ, a)
#   2. Simulate update: θ'(a) = θ + learning_rate * Δθ(a)
#   3. Score: score(a) = V_meta(θ'(a)) + beta * ||Δθ(a)||
#   4. Blend: π_final = (1-w) * π_greedy + w * softmax(scores)
#
# Key question: Does exploration bonus help meta-value-based planning?

experiment:
  name: "planning_meta_value_reward_plus_update_norm"
  type: "bandit"
  description: "Meta-value-based planning with update magnitude exploration bonus"

environment:
  n_arms: 5
  non_stationary: false
  drift_rate: 0.1
  seed: 42

agent:
  type: "self_gradient"
  learning_rate: 0.01
  meta_learning_rate: 0.001
  gradient_clip: 1.0
  buffer_size: 1000
  batch_size: 16
  exploration_episodes: 50
  hidden_dim: 32

  # Planning control - GATED
  enable_planning: true
  planning_warmup_episodes: 150  # Wait for gradient model AND meta-value to learn
  planning_grad_error_threshold: 0.25  # Only plan when gradient predictor is accurate
  planning_max_weight: 0.7  # Blend planning with greedy (don't fully override)
  planning_ramp_episodes: 100  # Gradually increase planning influence

  # Planning objective - META-VALUE + EXPLORATION
  planning_objective: "reward_plus_update_norm"  # V_meta(θ') + bonus
  planning_beta_self_change: 0.1  # Small exploration bonus (tune this if needed)
  gradient_step_scale: 1.0  # Standard gradient step size

baselines:
  - name: "epsilon_greedy"
    epsilon: 0.1
  - name: "ucb"
    ucb_c: 2.0

training:
  n_episodes: 1000
  log_interval: 50
  save_interval: 200

logging:
  log_dir: "logs"
  save_metrics: true
  save_plots: true
