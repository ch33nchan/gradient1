# Chain MDP Baseline Experiment
#
# Tests REINFORCE agent on simplest multi-step environment.
# Establishes baseline for meta-value learning in MDPs.
#
# Environment: Linear chain with 10 states, goal at end
# Agent: REINFORCE with baseline (Monte Carlo policy gradient)
# Expected: Agent should learn optimal policy (always right)

experiment:
  name: "chain_mdp_baseline"
  type: "mdp"
  description: "REINFORCE baseline on Chain MDP"

environment:
  env_type: "chain_mdp"
  n_states: 10
  max_steps: 100
  discount_factor: 0.99
  seed: 42

agent:
  type: "reinforce"
  learning_rate: 0.01
  hidden_dim: 64
  use_baseline: true   # Use baseline (mean return) for variance reduction
  entropy_bonus: 0.01  # Small entropy bonus for exploration

training:
  n_episodes: 500
  log_interval: 50
  eval_episodes: 100
  plot_window: 20

logging:
  log_dir: "logs"
  save_metrics: true
  save_plots: true

# Expected results:
# - Agent should learn to go right consistently
# - Episode length should decrease to ~9 steps (optimal)
# - Episode return should approach ~0.92 (0.99^8)
# - Success rate should approach 100%
